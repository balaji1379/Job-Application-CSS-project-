<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job registeration Form</title>
    <link rel="stylesheet" href="csspro2.css">
</head>
<body>
    <div class="box">
        <h2>Job Application Form</h2>
        <form>
            <label>Name</label>
            <input type="text" placeholder="Enter the name">
            <label>Email</label>
            <input type="email" placeholder="Enter the Email">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter The Mobile Number">
            <label>Qualification</label>
            <select>
                <option>Select Qualification </option>
                <option>B.Tech</option>
                <option>CSE</option>
                <option>AIDS</option>
                <option>ECE</option>
            </select>
            <label>Job Role</label>
            <input type="text" placeholder="Enter The Role">
            <label>Skills</label>
            <input type="text" placeholder="Enter The Skills">
            <button type="button">Register</button>

        </form>
    </div>
</body>
</html>
